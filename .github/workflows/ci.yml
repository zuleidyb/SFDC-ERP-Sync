name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  erp-simulator-tests:
    name: ERP Simulator - Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erp-simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: erp-simulator/package-lock.json
      - run: npm ci
      - run: npm test

  erp-simulator-contract-tests:
    name: ERP Simulator - Contract Tests (Newman)
    runs-on: ubuntu-latest
    needs: erp-simulator-tests
    defaults:
      run:
        working-directory: erp-simulator
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_simulator
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U erp"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp_simulator
      POSTGRES_PORT: 5432
      APP_PORT: 4000
      INTEGRATION_SERVICE_URL: http://localhost:4001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: erp-simulator/package-lock.json
      - run: npm ci
      - name: Apply database migrations
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql "postgresql://erp:erp@localhost:5432/erp_simulator" -f init.sql
          psql "postgresql://erp:erp@localhost:5432/erp_simulator" -f 002_sync_events.sql
          psql "postgresql://erp:erp@localhost:5432/erp_simulator" -f 003_soft_delete.sql
      - name: Start ERP Simulator
        run: |
          node server.js &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/health && break
            sleep 1
          done
      - name: Run Newman contract tests
        run: npx newman run postman/erp-simulator.postman_collection.json

  dashboard-build:
    name: Dashboard - Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build

  salesforce-ci:
    name: Salesforce - Deploy & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli
      - name: Write JWT key file
        run: echo "${{ secrets.SF_JWT_PRIVATE_KEY }}" > server.key
      - name: Authenticate to Salesforce org
        run: |
          sf org login jwt \
            --client-id "${{ secrets.SF_CONSUMER_KEY }}" \
            --jwt-key-file server.key \
            --username "${{ secrets.SF_USERNAME }}" \
            --instance-url "${{ secrets.SF_LOGIN_URL }}" \
            --alias ci-org \
            --set-default
      - name: Validate deploy with Apex tests (pull requests)
        if: github.event_name == 'pull_request'
        run: sf project deploy validate --source-dir force-app --test-level RunLocalTests --target-org ci-org
      - name: Deploy with Apex tests (push to main)
        if: github.event_name == 'push'
        run: sf project deploy start --source-dir force-app --test-level RunLocalTests --target-org ci-org
      - name: Clean up JWT key file
        if: always()
        run: rm -f server.key
