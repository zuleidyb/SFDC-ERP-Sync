services:
  erp-db:
    image: postgres:16-alpine
    container_name: sfdc-erp-sync-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - erp_db_data:/var/lib/postgresql/data

volumes:
  erp_db_data:
